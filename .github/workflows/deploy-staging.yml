name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabi-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      ALLOWED_ORIGINS: https://tabi-staging.tsito-apps.workers.dev
      EXPO_PUBLIC_API_URL: https://tabi-staging.tsito-apps.workers.dev
      EXPO_PUBLIC_ENABLE_DEMO: 'true'
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Cloudflare resources
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "tabi-staging") | (.uuid // .database_id)' | head -n 1)"
          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create tabi-staging
            database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "tabi-staging") | (.uuid // .database_id)' | head -n 1)"
          fi
          npx wrangler r2 bucket create tabi-documents-staging 2>&1 | tee /tmp/r2-create.log || grep -Fq "already exists" /tmp/r2-create.log
          node scripts/render-wrangler.mjs wrangler.staging.jsonc .wrangler.generated.jsonc "$database_id"
      - run: npm run check
      - name: Migrate and deploy
        run: |
          npx wrangler d1 execute DB --remote --config .wrangler.generated.jsonc --file worker/schema.sql
          npx wrangler deploy --config .wrangler.generated.jsonc --keep-vars
