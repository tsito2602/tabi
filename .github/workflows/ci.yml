name: Manual CI

# Normal Web/PWA validation runs once in Workers Builds before deployment.
# This optional fallback consumes Actions minutes: run only on explicit request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node --test scripts/test-workers-build.mjs
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run check
