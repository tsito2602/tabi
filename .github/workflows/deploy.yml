name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS_PRODUCTION || secrets.GOOGLE_CLIENT_IDS_PRODUCTION }}
      ALLOWED_ORIGINS: https://tabi.tsito-apps.workers.dev
      EXPO_PUBLIC_API_URL: https://tabi.tsito-apps.workers.dev
      EXPO_PUBLIC_ENABLE_DEMO: 'false'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID_PRODUCTION || secrets.GOOGLE_WEB_CLIENT_ID_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate production settings
        run: |
          node --input-type=module <<'NODE'
          const required = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'GOOGLE_CLIENT_IDS', 'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID'];
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`${name} is missing from production settings`);
          }
          const webClientId = process.env.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID.trim();
          const audiences = process.env.GOOGLE_CLIENT_IDS.split(',').map(value => value.trim()).filter(Boolean);
          if (!webClientId.endsWith('.apps.googleusercontent.com') || !audiences.includes(webClientId)) {
            throw new Error('Production Google audiences must include the production Web Client ID');
          }
          NODE
      - run: npm ci
      - run: npm run check
      - name: Resolve Cloudflare resources
        run: |
          database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "tabi") | (.uuid // .database_id)' | head -n 1)"
          if [[ -z "$database_id" ]]; then
            npx wrangler d1 create tabi
            database_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "tabi") | (.uuid // .database_id)' | head -n 1)"
          fi
          npx wrangler r2 bucket create tabi-documents 2>&1 | tee /tmp/r2-create.log || grep -Fq "already exists" /tmp/r2-create.log
          node scripts/render-wrangler.mjs wrangler.production.jsonc .wrangler.generated.jsonc "$database_id"
      - name: Migrate and deploy
        run: |
          npx wrangler d1 execute DB --remote --config .wrangler.generated.jsonc --file worker/schema.sql
          npx wrangler deploy --config .wrangler.generated.jsonc
      - name: Verify production HTTP responses
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.EXPO_PUBLIC_API_URL;
          const home = await fetch(origin);
          if (!home.ok || !home.headers.get('content-type')?.includes('text/html')) throw new Error('Production home is unavailable');
          const me = await fetch(`${origin}/v1/me`);
          if (me.status !== 401 || !me.headers.get('content-type')?.includes('application/json')) throw new Error('Production API routing is invalid');
          const body = await me.json();
          if (typeof body.error !== 'string') throw new Error('Production API response is invalid');
          const sw = await fetch(`${origin}/sw.js`);
          if (!sw.ok || !/javascript/.test(sw.headers.get('content-type') ?? '')) throw new Error('Production service worker is unavailable');
          console.log('Production home, API routing, and service worker verified');
          NODE
